<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VMS Industrie — Spare-parts Intelligence</title>
<style>
  :root{
    --bg:#f4f4f6; --card:#ffffff; --sidebar:#141518; --sidebar-2:#1f2126;
    --text:#141518; --muted:#63666e; --line:#e3e5e8; --line-2:#cbd0d6;
    --primary:#e31b23; --primary-soft:#fde8e9; --accent:#b91c1c;
    --ok:#16a34a; --ok-soft:#eafbf1; --warn:#d97706; --warn-soft:#fff6e6;
    --danger:#dc2626; --danger-soft:#fef0f0; --purple:#7c3aed; --purple-soft:#f4efff;
    --radius:14px; --shadow:0 1px 2px rgba(20,21,24,.04),0 8px 24px rgba(20,21,24,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .app{display:flex;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:252px;flex:0 0 252px;background:var(--sidebar);color:#cbd5e1;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:22px 20px 18px}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#0891b2);display:grid;place-items:center;color:#fff;font-weight:800}
  .brand-name{font-size:16px;font-weight:700;color:#fff;letter-spacing:.2px}
  .brand-sub{font-size:10.5px;color:#7c8ba6;text-transform:uppercase;letter-spacing:1.2px}
  .nav-label{padding:14px 22px 6px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#5b6b86}
  .nav{padding:0 10px;display:flex;flex-direction:column;gap:3px}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;
    background:transparent;border:0;color:#b7c3d8;text-align:left;width:100%;transition:.15s;
  }
  .nav-item:hover{background:var(--sidebar-2);color:#fff}
  .nav-item.active{background:linear-gradient(90deg,rgba(227,27,35,.32),rgba(227,27,35,.08));color:#fff;box-shadow:inset 2px 0 0 #ff4d54}
  .nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.9}
  .nav-item .step{margin-left:auto;font-size:10px;font-weight:700;color:#7f8fab;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:5px}
  .nav-item.active .step{color:#fecaca;background:rgba(227,27,35,.24)}
  .side-foot{margin-top:auto;padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,.07)}
  .side-foot .tiny{font-size:10.5px;color:#6d7d98;line-height:1.6}
  .jit-pill{display:flex;align-items:center;gap:7px;font-size:11px;color:#94a3b8;margin-bottom:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:#64748b;display:inline-block}
  .dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .dot.warn{background:#f59e0b}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    height:64px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;
    position:sticky;top:0;z-index:20;
  }
  .crumb{font-size:12px;color:var(--muted)}
  .crumb b{color:var(--text);font-weight:600}
  .topbar .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:#f1f5f9;border:1px solid transparent;border-radius:9px;padding:8px 11px;color:var(--muted);width:210px}
  .search input{border:0;background:transparent;outline:0;width:100%;font-size:12.5px}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:hover{background:#f8fafc;color:var(--text)}
  .avatar{width:34px;height:34px;border-radius:50%;background:#0f172a;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
  .content{padding:26px 28px 40px;max-width:1320px;width:100%;margin:0 auto;flex:1}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
  .page-head h1{margin:0;font-size:22px;letter-spacing:-.4px}
  .page-head p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:640px}
  .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);font-weight:700;margin-bottom:5px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-h h3{margin:0;font-size:14px;font-weight:650}
  .card-h .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .card-b{padding:18px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g-2-1{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
  .g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
  @media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g-2-1,.g-1-2,.g3{grid-template-columns:1fr}}
  @media(max-width:720px){.g2,.g4{grid-template-columns:1fr}.sidebar{display:none}.content{padding:18px}.topbar{padding:0 16px}}

  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
  .btn:hover{background:#f8fafc;border-color:var(--line-2)}
  .btn svg{width:14px;height:14px}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:#c8161d}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.ok:hover{background:#15803d}
  .btn.danger{color:var(--danger);border-color:#fecaca;background:#fff}
  .btn.danger:hover{background:var(--danger-soft)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#f1f5f9;color:var(--text)}
  .btn.sm{padding:6px 10px;font-size:11.5px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}
  .b-crit{background:var(--danger-soft);color:var(--danger)}
  .b-high{background:var(--warn-soft);color:var(--warn)}
  .b-med{background:var(--primary-soft);color:var(--primary)}
  .b-low{background:#f1f5f9;color:var(--muted)}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .b-purple{background:var(--purple-soft);color:var(--purple)}
  .b-gray{background:#f1f5f9;color:#64748b}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  select,input[type=text],input[type=number],textarea{
    border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:9px 11px;outline:0;font-size:13px;width:100%
  }
  select:focus,input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{resize:vertical;min-height:88px}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--muted)}
  .chip b{color:var(--text)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
  td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{transition:.12s}
  tbody tr:hover{background:#fafcff}
  tr.flash{animation:flash 1.8s ease}
  @keyframes flash{0%,60%{background:#fff7d6}100%{background:transparent}}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .strong{font-weight:650}
  .muted{color:var(--muted)}
  .tiny{font-size:11px}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px}
  .tab{border:0;background:transparent;padding:13px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--primary);border-color:var(--primary)}
  .tab .cnt{font-size:10px;background:#f1f5f9;padding:1px 6px;border-radius:10px;margin-left:5px}
  .tab.active .cnt{background:var(--primary-soft);color:var(--primary)}

  .stat{padding:16px 18px}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:650}
  .stat .v{font-size:26px;font-weight:750;letter-spacing:-.8px;margin-top:6px}
  .stat .d{font-size:11.5px;margin-top:4px;color:var(--muted)}
  .pos{color:var(--ok)!important}.neg{color:var(--danger)!important}

  .range-wrap{padding:6px 2px}
  .range-track{height:12px;border-radius:20px;background:linear-gradient(90deg,#fee2e2,#fecaca,#fca5a5);position:relative;margin:26px 8px 30px}
  .range-base{position:absolute;top:-8px;width:3px;height:28px;background:var(--primary);border-radius:2px}
  .range-cap{position:absolute;top:-5px;width:2px;height:22px;background:#64748b}
  .range-lbl{position:absolute;top:-30px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
  .range-lbl.b{color:var(--primary);font-weight:700}
  .slider{width:100%;accent-color:var(--primary);cursor:pointer}

  .driver{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9}
  .driver:last-child{border-bottom:0}
  .driver .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:0 0 30px}
  .driver .ic.up{background:var(--ok-soft);color:var(--ok)}
  .driver .ic.down{background:var(--danger-soft);color:var(--danger)}
  .driver .txt{flex:1;font-size:12.5px}
  .driver .txt small{display:block;color:var(--muted);font-size:11px}

  .alert-row{cursor:pointer}
  .alert-row td:first-child{border-left:3px solid transparent}
  .alert-row.critical td:first-child{border-left-color:var(--danger)}
  .alert-row.high td:first-child{border-left-color:var(--warn)}
  .alert-row.medium td:first-child{border-left-color:var(--primary)}
  .alert-row.low td:first-child{border-left-color:var(--line-2)}

  .sat-card{text-align:center;padding:18px 12px}
  .sat-ring{position:relative;width:92px;height:92px;margin:0 auto 10px}
  .sat-ring svg{transform:rotate(-90deg)}
  .sat-val{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:750}
  .sat-lbl{font-size:12px;font-weight:650}
  .spark{width:100%;height:34px;display:block;margin-top:8px}

  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:9px;height:9px;border-radius:3px;display:inline-block}

  .nextbar{
    margin-top:22px;padding:14px 18px;border:1px dashed var(--line-2);border-radius:12px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.6)
  }
  .nextbar .lbl{font-size:11.5px;color:var(--muted)}
  .nextbar .lbl b{color:var(--text)}

  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal-mask.open{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
  .modal-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h3{margin:0;font-size:16px}
  .modal-b{padding:20px;display:flex;flex-direction:column;gap:14px}
  .modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fafbfc}

  .toast-wrap{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;flex-direction:column;gap:10px}
  .toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:12.5px;display:flex;align-items:center;gap:9px;animation:slide .25s ease}
  .toast .tk{width:20px;height:20px;border-radius:50%;background:#22c55e;display:grid;place-items:center;font-size:12px}
  @keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

  .screen{display:none}.screen.active{display:block}
  .health{display:flex;align-items:center;gap:8px;font-size:12px}
  .health .bar{width:54px;height:5px;border-radius:8px;background:#e2e8f0;overflow:hidden}
  .health .bar i{display:block;height:100%;border-radius:8px}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .note{background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:12px;color:#475569}
  /* ---------- Motion layer: transitions.dev / ObsidianUI / Aceternity / Bencho / BoardUI ---------- */
  :root{--ease:cubic-bezier(.22,1,.36,1)}
  @keyframes vtOut{to{opacity:0;transform:translateY(-8px) scale(.99);filter:blur(4px)}}
  @keyframes vtIn{from{opacity:0;transform:translateY(14px) scale(.99);filter:blur(5px)}}
  ::view-transition-old(root){animation:.24s ease both vtOut}
  ::view-transition-new(root){animation:.42s var(--ease) both vtIn}
  @keyframes revealUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .reveal{animation:revealUp .55s var(--ease) backwards}
  .reveal.flash{animation:revealUp .55s var(--ease) backwards,flash 1.8s ease}
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes maskIn{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  @keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(34,197,94,.35)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  @keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
  .modal-mask.open{animation:maskIn .22s ease both}
  .modal-mask.open .modal{animation:modalIn .34s var(--ease) both}
  .shake{animation:shake .42s ease!important}
  .icon-btn.spinning svg{animation:spin .7s var(--ease)}
  .bars svg rect{transform-box:fill-box;transform-origin:bottom;animation:barGrow .65s var(--ease) backwards}
  .dot.on{animation:pulseRing 2.4s infinite}

  /* Aceternity-style tilt + spotlight */
  .tilt{position:relative;transform-style:preserve-3d;transition:transform .3s var(--ease),box-shadow .3s var(--ease);will-change:transform}
  .tilt:hover{box-shadow:0 18px 40px rgba(15,23,42,.10)}
  .spot{overflow:hidden}
  .spot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
    background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(227,27,35,.11),transparent 62%)}
  .spot:hover::after{opacity:1}
  .sheen{position:relative;overflow:hidden}
  .sheen::before{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%);pointer-events:none}
  .sheen:hover::before{animation:sheen .85s var(--ease)}
  .magnetic{transition:transform .28s var(--ease),background .15s,border-color .15s!important}
  .lift{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
  .lift:hover{transform:translateY(-3px)}

  /* Bencho-style slide to confirm */
  .slide{position:relative;width:150px;height:38px;user-select:none;touch-action:none}
  .slide-track{position:absolute;inset:0;border-radius:10px;background:#f1f5f9;border:1px solid var(--line-2);overflow:hidden}
  .slide-fill{position:absolute;left:0;top:0;height:100%;width:38px;background:linear-gradient(90deg,#dcfce7,#bbf7d0);transition:width .3s var(--ease)}
  .slide-thumb{position:absolute;left:3px;top:3px;width:30px;height:30px;border-radius:8px;background:var(--ok);color:#fff;display:grid;place-items:center;
    font-size:14px;font-weight:800;cursor:grab;box-shadow:0 2px 6px rgba(22,163,74,.35);z-index:2;touch-action:none}
  .slide-thumb:active{cursor:grabbing}
  .slide-label{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#15803d;letter-spacing:.1px;pointer-events:none;z-index:1}
  .decide{display:flex;align-items:center;gap:5px;justify-content:flex-end;flex-wrap:wrap}

  /* BoardUI-style decision board */
  .view-toggle{display:flex;background:#f1f5f9;border-radius:9px;padding:3px;gap:2px}
  .view-toggle button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-size:11.5px;font-weight:650;color:var(--muted)}
  .view-toggle button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.09)}
  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#f8fafc}
  @media(max-width:900px){.board{grid-template-columns:1fr}}
  .board-col{background:#f1f5f9;border:1px solid var(--line);border-radius:12px;padding:11px;min-height:190px}
  .board-col h4{margin:2px 4px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:flex;justify-content:space-between}
  .board-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
  .board-card:hover{border-color:#fecaca}

  /* three.js hosts */
  .three-host{position:relative;min-height:210px;flex:0 0 300px;width:300px;border-radius:12px;overflow:hidden;
    background:radial-gradient(circle at 50% 50%,#fef2f2 0%,#fff8f8 55%,transparent 75%)}
  .three-host.small{flex:none;width:100%;min-height:190px}
  .three-host canvas{position:relative;z-index:1;display:block;width:100%!important;height:100%!important}
  .orb-fallback{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;
    border:1px dashed #fca5a5;box-shadow:inset 0 0 40px rgba(227,27,35,.10),0 0 30px rgba(227,27,35,.08)}
  .hero-title{font-size:29px;line-height:1.14;letter-spacing:-1px;font-weight:760;margin:8px 0 8px}
  @media(max-width:1050px){.three-host{flex-basis:240px;width:240px}}
  .arrow-link svg{transition:transform .25s var(--ease)}
  .arrow-link:hover svg{transform:translateX(4px)}
  td svg,.alert-row svg,.board-card svg{width:14px;height:14px}
  .slide-label svg{width:12px;height:12px}
</style>
</head>
<body>
<div class="app">

function sparkline(series,color){
  const w=120,h=34,min=Math.min(...series)-2,max=Math.max(...series)+2;
  const pts=series.map((v,i)=>`${(i/(series.length-1))*w},${h-((v-min)/(max-min))*h}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function groupedBars(){
  const W=620,H=250,pl=42,pb=34,pt=14;
  const cw=(W-pl-10)/AGES.length, groupW=cw*0.68, barW=groupW/PARTS.length;
  let out=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  [0,25,50,75,100].forEach(t=>{
    const y=pt+(H-pt-pb)*(1-t/100);
    out+=`<line x1="${pl}" y1="${y}" x2="${W-8}" y2="${y}" stroke="#eef2f7"/><text x="${pl-8}" y="${y+3}" text-anchor="end" font-size="9" fill="#94a3b8">${t}%</text>`;
  });
  AGES.forEach((age,ai)=>{
    const x0=pl+ai*cw+(cw-groupW)/2;
    PARTS.forEach((p,pi)=>{
      const v=p.data[ai], bh=(H-pt-pb)*(v/100), x=x0+pi*barW, y=H-pb-bh;
      out+=`<rect x="${x}" y="${y}" width="${barW-2}" height="${bh}" rx="2" fill="${p.color}" opacity=".9" style="animation-delay:${(ai*4+pi)*35}ms"><title>${esc(p.name)} · ${esc(age)}: ${v}%</title></rect>`;
    });
    out+=`<text x="${pl+ai*cw+cw/2}" y="${H-12}" text-anchor="middle" font-size="10" fill="#64748b">${esc(age)}</text>`;
  });
  out+='</svg>';
  return out;
}

/* ============================ Motion + three.js layer ============================ */
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function cnt(v,opt){
  opt=opt||{};
  const dec=opt.dec||0, p=opt.p||'', s=opt.s||'';
  const fmt=x=>p+x.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+s;
  return `<span class="count" data-v="${v}" data-d="${dec}" data-p="${p}" data-s="${s}">${fmt(v)}</span>`;
}
function animateCount(el){
  if(el.dataset.done) return; el.dataset.done='1';
  const to=parseFloat(el.dataset.v), dec=+(el.dataset.d||0), p=el.dataset.p||'', s=el.dataset.s||'';
  const fmt=x=>p+x.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+s;
  const st=performance.now(), dur=760;
  (function step(t){
    const k=Math.min(1,(t-st)/dur), e=1-Math.pow(1-k,3);
    el.textContent=fmt(to*e);
    if(k<1) requestAnimationFrame(step);
  })(performance.now());
}
function setupSlide(el){
  const track=el.querySelector('.slide-track'), thumb=el.querySelector('.slide-thumb'),
        fill=el.querySelector('.slide-fill'), label=el.querySelector('.slide-label'), id=el.dataset.id;
  let dragging=false, startX=0, cur=0, max=1;
  const paint=x=>{
    cur=x; thumb.style.transform=`translateX(${x}px)`;
    fill.style.width=(x+38)+'px';
    label.style.opacity=String(Math.max(0,1-x/max*1.5));
  };
  thumb.addEventListener('pointerdown',e=>{
    dragging=true; startX=e.clientX-cur; max=Math.max(1,track.clientWidth-thumb.offsetWidth-6);
    thumb.setPointerCapture(e.pointerId); thumb.style.transition='none'; fill.style.transition='none';
  });
  thumb.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const x=Math.max(0,Math.min(max,e.clientX-startX));
    paint(x); thumb.dataset.ready=(x/max>.9)?'1':'';
  });
  const end=()=>{
    if(!dragging) return; dragging=false;
    thumb.style.transition='transform .32s var(--ease)'; fill.style.transition='width .32s var(--ease)';
    if(thumb.dataset.ready==='1'){
      label.textContent='Approved ✓'; label.style.opacity='1';
      setTimeout(()=>approve(id),190);
    }else{ paint(0); label.style.opacity='1'; }
  };
  thumb.addEventListener('pointerup',end);
  thumb.addEventListener('pointercancel',end);
}
function enhance(){
  document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.animationDelay=(i*42)+'ms'});
  if(reduceMotion()) return;
  document.querySelectorAll('.count').forEach(animateCount);
  document.querySelectorAll('.tilt').forEach(el=>{
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      el.style.transform=`perspective(1000px) rotateX(${-y*4.5}deg) rotateY(${x*4.5}deg) translateY(-2px)`;
    });
    el.addEventListener('mouseleave',()=>{el.style.transform=''});
  });
  document.querySelectorAll('.spot').forEach(el=>{
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect();
      el.style.setProperty('--mx',(e.clientX-r.left)+'px');
      el.style.setProperty('--my',(e.clientY-r.top)+'px');
    });
  });
  document.querySelectorAll('.magnetic').forEach(el=>{
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect();
      el.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.16}px,${(e.clientY-r.top-r.height/2)*.16}px)`;
    });
    el.addEventListener('mouseleave',()=>{el.style.transform=''});
  });
  document.querySelectorAll('.slide').forEach(setupSlide);
}

let rig=null;
const pointer={x:0,y:0};
window.addEventListener('mousemove',e=>{
  pointer.x=(e.clientX/window.innerWidth-.5)*2;
  pointer.y=(e.clientY/window.innerHeight-.5)*2;
});
function disposeRig(){
  if(!rig) return;
  cancelAnimationFrame(rig.raf); rig.ro.disconnect();
  if(rig.renderer){rig.renderer.dispose(); rig.renderer.domElement.remove()}
  rig=null;
}
function randDir(){
  const u=Math.random()*2-1, a=Math.random()*Math.PI*2, s=Math.sqrt(1-u*u);
  return new THREE.Vector3(Math.cos(a)*s,u,Math.sin(a)*s);
}
function makeRig(host,kind){
  if(!window.THREE||!host) return null;
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(45,(host.clientWidth/host.clientHeight)||1,.1,100);
  cam.position.z=kind==='globe'?3.35:3.0;
  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(host.clientWidth||300,host.clientHeight||210,false);
  renderer.domElement.style.cssText='width:100%;height:100%;display:block';
  host.appendChild(renderer.domElement);
  const group=new THREE.Group(); scene.add(group);
  let intensity=1;

  if(kind==='globe'){
    const pos=[], N=760;
    for(let i=0;i<N;i++){
      const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), th=Math.PI*(3-Math.sqrt(5))*i;
      pos.push(Math.cos(th)*r*1.02,y*1.02,Math.sin(th)*r*1.02);
    }
    const pg=new THREE.BufferGeometry();
    pg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    group.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xe31b23,size:.022,transparent:true,opacity:.8})));
    const seg=[];
    for(let i=0;i<105;i++){
      const a=randDir().multiplyScalar(1.02), b=randDir().multiplyScalar(1.02);
      const q=new THREE.Quaternion().setFromUnitVectors(a.clone().normalize(),b.clone().normalize());
      let prev=a;
      for(let s=1;s<=7;s++){
        const rq=new THREE.Quaternion().slerp(q,s/7), p=a.clone().applyQuaternion(rq);
        seg.push(prev.x,prev.y,prev.z,p.x,p.y,p.z); prev=p;
      }
    }
    const lg=new THREE.BufferGeometry();
    lg.setAttribute('position',new THREE.Float32BufferAttribute(seg,3));
    group.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xf87171,transparent:true,opacity:.15})));
    const ring=new THREE.Mesh(new THREE.RingGeometry(1.22,1.235,72),new THREE.MeshBasicMaterial({color:0xfca5a5,transparent:true,opacity:.4,side:THREE.DoubleSide}));
    ring.rotation.x=Math.PI/2.5; group.add(ring);
  }else{
    const knot=new THREE.Mesh(
      new THREE.TorusKnotGeometry(.68,.18,140,14,2,3),
      new THREE.MeshBasicMaterial({color:0xe31b23,wireframe:true,transparent:true,opacity:.3})
    );
    group.add(knot);
    const pos=[];
    for(let i=0;i<280;i++){const d=randDir().multiplyScalar(1.1);pos.push(d.x,d.y,d.z)}
    const pg=new THREE.BufferGeometry();
    pg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    group.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x1f2126,size:.019,transparent:true,opacity:.55})));
  }

  const ro=new ResizeObserver(()=>{
    const w=host.clientWidth,h=host.clientHeight;
    if(!w||!h) return;
    cam.aspect=w/h; cam.updateProjectionMatrix(); renderer.setSize(w,h,false);
  });
  ro.observe(host);
  let raf;
  function loop(){
    raf=requestAnimationFrame(loop);
    group.rotation.y+=(kind==='globe'?.0015:.004*intensity);
    group.rotation.x+=(pointer.y*.12-group.rotation.x)*.035;
    group.rotation.z+=(pointer.x*.05-group.rotation.z)*.025;
    const target=kind==='globe'?1:(.82+intensity*.2);
    group.scale.lerp(new THREE.Vector3(target,target,target),.06);
    renderer.render(scene,cam);
  }
  loop();
  return {raf,ro,renderer,setIntensity:v=>{intensity=v}};
}
function mountThree(){
  disposeRig();
  if(!window.THREE||reduceMotion()) return;
  const host = state.screen==='overview' ? document.getElementById('hero3d')
             : state.screen==='forecast' ? document.getElementById('forecast3d') : null;
  if(host){ try{ rig=makeRig(host,state.screen==='overview'?'globe':'knot'); }
    catch(err){ host.innerHTML='<div class="orb-fallback"></div>'; } }
}
function paint(after){
  const update=()=>{render();enhance();mountThree();if(after)after()};
  if(document.startViewTransition && !reduceMotion()) document.startViewTransition(update);

}

const MODEL_META = {
  'VMS Driver 125': {motoPrice: 380000, avgPartPrice: 3400, baseUnits: 14200, keyPart: 'Front Brake Pads (DRIV032)'},
  'VMS XDV 300':    {motoPrice: 894000, avgPartPrice: 8900, baseUnits: 6800,  keyPart: 'Commodo G/D (XDV3/001)'},
  'VMS Vmax 200':   {motoPrice: 517000, avgPartPrice: 5200, baseUnits: 9400,  keyPart: 'Drive Belt & Roller Kit'},
  'VMS Joci 125':   {motoPrice: 255000, avgPartPrice: 2600, baseUnits: 16500, keyPart: 'Fuel Filter (DRIV067)'},
  'VMS12 Commercial':{motoPrice: 365000, avgPartPrice: 4800, baseUnits: 5100, keyPart: 'Rear Axle & Brake Shoe'}
};
const AGENCY_FACTOR = {
  'Toudja Central (Béjaïa)': 1.25,
  'Algiers (El Harrach)': 1.35,
  'Oran Agency': 1.15,
  'Constantine Agency': 0.95,
  'Bouira Plant': 0.85
};
function baseDemand(){
  const m = MODEL_META[state.model] || MODEL_META['VMS Driver 125'];
  const f = AGENCY_FACTOR[state.agency] || 1.0;
  return Math.round(m.baseUnits * f);
}
function forecast(){
  const m = MODEL_META[state.model] || MODEL_META['VMS Driver 125'];
  const base=baseDemand(), p=state.price;
  const demand=Math.round(base*(1-0.012*p));
  const price=Math.round(m.avgPartPrice*(1+p/100));
  const revenue=Math.round(demand*price);
  return {base,demand,price,motoPrice:m.motoPrice,keyPart:m.keyPart,revenue,low:Math.round(demand*0.88),high:Math.round(demand*1.11),delta:Math.round((demand/base-1)*100)};
}

function trendChart(f){
  const W=640,H=220,pl=40,pb=26,pt=12;
  const hist=[6200,7100,6900,7800,8200,f.base], max=Math.max(f.high,...hist)*1.05;
  const x=i=>pl+i*((W-pl-12)/(hist.length-1+1.5)), y=v=>pt+(H-pt-pb)*(1-v/max);
  let out=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  [0,.25,.5,.75,1].forEach(t=>{const yy=pt+(H-pt-pb)*(1-t);out+=`<line x1="${pl}" y1="${yy}" x2="${W-8}" y2="${yy}" stroke="#eef2f7"/><text x="${pl-7}" y="${yy+3}" text-anchor="end" font-size="9" fill="#94a3b8">${Math.round(max*t/1000)}k</text>`});
  const pts=hist.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const bx=x(hist.length-1), fx=x(hist.length), ly=y(f.low), hy=y(f.high);
  out+=`<rect x="${bx}" y="${hy}" width="${fx-bx}" height="${ly-hy}" rx="4" fill="#fee2e2"/>`;
  out+=`<line x1="${bx}" y1="${y(f.base)}" x2="${fx}" y2="${y(f.base)}" stroke="#e31b23" stroke-width="2" stroke-dasharray="4 3"/>`;
  out+=`<polyline points="${pts}" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  hist.forEach((v,i)=>{out+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#fff" stroke="#0f172a" stroke-width="2"/>`});
  out+=`<text x="${bx}" y="${H-8}" text-anchor="middle" font-size="9" fill="#64748b">Now</text><text x="${fx}" y="${H-8}" text-anchor="middle" font-size="9" fill="#e31b23">Forecast</text>`;
  out+='</svg>';
  return out;
}

function openReason(kind,id){

    `<div class="note">${kind==='edit'?'Describe the change you want to make.':'Tell us why this recommendation is not right.'} This reason is saved to the <b>audit log</b> and used to improve the model.</div>
     <div class="field"><label>Reason (required)</label><textarea id="reasonText" placeholder="${kind==='edit'?'e.g. Reduce quantity to 80; supplier lead time changed':'e.g. Demand assumption too aggressive for this region'}"></textarea></div>`,

function openGrant(){
  openModal('Grant temporary admin access',
    `<div class="field"><label>Role</label><select id="gRole"><option>Temporary Admin</option><option>Data Steward</option><option>Auditor (read-only)</option></select></div>
     <div class="field"><label>User</label><input id="gUser" type="text" placeholder="e.g. Y. Hamidi"/></div>
     <div class="field"><label>Scope</label><input id="gScope" type="text" placeholder="e.g. Forecast approvals"/></div>
     <div class="field"><label>Duration</label><select id="gDur"><option>4 hours</option><option>8 hours</option><option>24 hours</option></select></div>
     <div class="note">Access expires automatically. The grant is recorded in the audit log.</div>`,
    'Grant access',()=>{
      const u=document.getElementById('gUser').value.trim(), sc=document.getElementById('gScope').value.trim();
      if(!u||!sc){toast('Enter a user and scope');return false}
      const role=document.getElementById('gRole').value,dur=document.getElementById('gDur').value;
      state.jit.unshift({role,user:u,scope:sc,start:'Just now',expiry:'In '+dur,status:'Active'});
      addAudit('Granted JIT',u,`${role} · ${dur}`);
      paint();toast(`Temporary access granted to ${u}`);return true;
    });
}
function rollback(i){
  const v=state.versions[i];v.status='Archived';
  state.versions.forEach(x=>{if(x.v==='v4.1.3')x.status='Production'});
  addAudit('Rollback','v4.1.3',`Promoted after ${v.v} issue`);
  paint();toast('Rolled back to v4.1.3');
}
function exportAudit(){
  const rows=[['Timestamp','Actor','Action','Target','Detail'],...state.audit.map(a=>[a.ts,a.user,a.action,a.target,a.detail])];
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vms-industrie-audit.csv';a.click();
  toast('Audit log exported');
}

/* ============================ Modal plumbing ============================ */
let modalAction=null;
function openModal(title,body,submitLabel,action){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalSubmit').textContent=submitLabel;
  modalAction=action;
  document.getElementById('modalMask').classList.add('open');
}
function closeModal(){document.getElementById('modalMask').classList.remove('open');modalAction=null}
document.getElementById('modalX').onclick=closeModal;
document.getElementById('modalCancel').onclick=closeModal;
document.getElementById('modalMask').onclick=e=>{if(e.target.id==='modalMask')closeModal()};
document.getElementById('modalSubmit').onclick=()=>{if(modalAction&&modalAction()!==false)closeModal()};
document.getElementById('refreshBtn').onclick=e=>{
  const btn=e.currentTarget;
  btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'),720);
  toast('All data sources refreshed');
};

/* ============================ Boot ============================ */
render(); enhance(); mountThree();
</script>
