<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e31b23" />
    <meta name="description" content="VMS Industrie — spare-parts intelligence dashboard" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tifinagh:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>VMS Industrie — Spare-parts Intelligence</title>
    <script>
      /* Applied before paint so the saved theme never flashes. */
      (function () {
        try {
          var stored = localStorage.getItem('vms.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
